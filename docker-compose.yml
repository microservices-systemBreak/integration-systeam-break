version: '3.8'

services:
  # --- Infraestructura Base ---
  postgres:
    image: postgres:16
    environment:
      # La BD inicial no es tan importante, ya que init.sql crea las específicas
      POSTGRES_DB: postgres 
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - sb_postgres_data_new:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - system-break-net

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - sb_rabbitmq_data:/var/lib/rabbitmq
    networks:
      - system-break-net

  # --- C# Services ---
  sb-core-orchestrator: # Nombre de servicio consistente con el Gateway
    build:
      context: .
      dockerfile: sb-core-orchestrator/Dockerfile
    container_name: sb_core_orchestrator_container
    ports:
      - "5001:5001" # Puerto estándar para este servicio
    environment:
      - ASPNETCORE_URLS=http://+:5001 # Instruye a C# para que escuche en el puerto 5001
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=sb_core_db;Username=postgres;Password=password
      - RabbitMQ__Host=rabbitmq
    depends_on:
      - postgres
      - rabbitmq
    networks:
      - system-break-net

  sb-vuln-analyzer: # Nombre de servicio consistente
    build:
      context: .
      dockerfile: sb-vuln-analyzer/Dockerfile
    container_name: sb_vuln_analyzer_container
    ports:
      - "5002:5002" # Puerto estándar para este servicio
    environment:
      - ASPNETCORE_URLS=http://+:5002
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=sb_vuln_db;Username=postgres;Password=password
    depends_on:
      - postgres
    networks:
      - system-break-net

  sb-error-monitor: # Nombre de servicio consistente
    build:
      context: .
      dockerfile: sb-error-monitor/Dockerfile
    container_name: sb_error_monitor_container
    ports:
      - "5003:5003" # Puerto estándar para este servicio
    environment:
      - ASPNETCORE_URLS=http://+:5003
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=sb_error_db;Username=postgres;Password=password
      - RabbitMQ__Host=rabbitmq
    depends_on:
      - postgres
      - rabbitmq
    networks:
      - system-break-net

  # --- Java Services ---
  sb-api-gateway:
    build:
      context: .
      dockerfile: sb-api-gateway/Dockerfile
    container_name: sb_api_gateway
    ports:
      - "8000:8080" 
    depends_on:
      - sb-auth-service
      - sb-core-orchestrator
      - sb-reporting-service
    networks:
      - system-break-net

  sb-auth-service:
    build:
      context: .
      dockerfile: sb-auth-service/Dockerfile
    container_name: sb_auth_service_container
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/sb_auth_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=password
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - JWT_SECRET=3t6w9z$C&F)J@NcRfUjWnZr4u7x!A%D*G-KaPdSgVkYp3s6v8y/B?E(H+MbQeThW # Secret key of at least 256 bits
      - JWT_EXPIRATION_MS=86400000 # 1 day
      - JWT_REFRESH_EXPIRATION_MS=604800000 # 7 days
    depends_on:
      - postgres
    networks:
      - system-break-net

  sb-reporting-service:
    build:
      context: .
      dockerfile: sb-reporting-service/Dockerfile
    container_name: sb_reporting_service_container
    ports:
      - "8084:8080" # Mapeamos al puerto 8084 que definimos en su application.yml
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/sb_reporting_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=password
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=guest
      - SPRING_RABBITMQ_PASSWORD=guest
    depends_on:
      - postgres
      - rabbitmq
    networks:
      - system-break-net

volumes:
  sb_postgres_data_new:
  sb_rabbitmq_data:

# Red compartida para todos los microservicios del sistema
networks:
  system-break-net:
    driver: bridge
