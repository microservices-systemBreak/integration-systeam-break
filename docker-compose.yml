version: '3.8'

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: system_break
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - sb_postgres_data_new:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  # --- C# Services ---
  core-orchestrator:
    build:
      context: .
      dockerfile: sb-core-orchestrator/Dockerfile
    ports:
      - "${PORT_CORE}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ConnectionStrings__DefaultConnection=Host=${DB_HOST};Database=sb_core_db;Username=${DB_USER};Password=${DB_PASSWORD}
      - RabbitMQ__Host=${RABBITMQ_HOST}
      - RabbitMQ__Username=${RABBITMQ_USER}
      - RabbitMQ__Password=${RABBITMQ_PASSWORD}
      - Services__VulnAnalyzer=http://vuln-analyzer:8080
    depends_on:
      - postgres
      - rabbitmq

  vuln-analyzer:
    build:
      context: .
      dockerfile: sb-vuln-analyzer/Dockerfile
    ports:
      - "${PORT_VULN}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ConnectionStrings__DefaultConnection=Host=${DB_HOST};Database=sb_vuln_db;Username=${DB_USER};Password=${DB_PASSWORD}
    depends_on:
      - postgres

  error-monitor:
    build:
      context: .
      dockerfile: sb-error-monitor/Dockerfile
    ports:
      - "${PORT_ERROR}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ConnectionStrings__DefaultConnection=Host=${DB_HOST};Database=sb_error_db;Username=${DB_USER};Password=${DB_PASSWORD}
      - RabbitMQ__Host=${RABBITMQ_HOST}
      - RabbitMQ__Username=${RABBITMQ_USER}
      - RabbitMQ__Password=${RABBITMQ_PASSWORD}
    depends_on:
      - postgres
      - rabbitmq

  # --- Java Services ---
  sb-api-gateway:
    build:
      context: .
      dockerfile: sb-api-gateway/Dockerfile
    ports:
      - "${PORT_GATEWAY}:8080"
    environment:
      - SERVER_PORT=8080
      - SPRING_CLOUD_GATEWAY_ROUTES_0_URI=http://sb-auth-service:8080
      - SPRING_CLOUD_GATEWAY_ROUTES_0_PREDICATES_0=Path=/auth/**
      - SPRING_CLOUD_GATEWAY_ROUTES_1_URI=http://core-orchestrator:8080
      - SPRING_CLOUD_GATEWAY_ROUTES_1_PREDICATES_0=Path=/api/scans/**
      - SPRING_CLOUD_GATEWAY_ROUTES_2_URI=http://sb-reporting-service:8081
      - SPRING_CLOUD_GATEWAY_ROUTES_2_PREDICATES_0=Path=/reports/**
    depends_on:
      - sb-auth-service
      - core-orchestrator
      - sb-reporting-service

  sb-auth-service:
    build:
      context: ./sb-auth-service
      dockerfile: Dockerfile
    ports:
      - "${PORT_AUTH}:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://${DB_HOST}:${DB_PORT}/sb_auth_db
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION_MS=${JWT_EXPIRATION_MS}
      - JWT_REFRESH_EXPIRATION_MS=${JWT_REFRESH_EXPIRATION_MS}
    depends_on:
      - postgres

  sb-reporting-service:
    build:
      context: .
      dockerfile: sb-reporting-service/Dockerfile
    ports:
      - "${PORT_REPORTING}:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://${DB_HOST}:${DB_PORT}/sb_reporting_db
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SERVER_PORT=8081
      - SPRING_RABBITMQ_HOST=${RABBITMQ_HOST}
      - SPRING_RABBITMQ_PORT=${RABBITMQ_PORT}
      - SPRING_RABBITMQ_USERNAME=${RABBITMQ_USER}
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
    depends_on:
      - postgres
      - rabbitmq

  sb-agent:
    build: .
    container_name: sb-agent-service

    # IMPORTANTE 1: Permisos y Red
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_ADMIN

    # 🚨 AÑADIDO: Otorga permisos amplios para control de bajo nivel del Host
    privileged: true

    # 🚨 AÑADIDO: Permite que el contenedor vea y acceda a los PIDs del Host.
    # Esto es crítico para que 'shutdown' funcione contra el sistema init del Host.
    pid: host

    # IMPORTANTE 2: Networking
    network_mode: host

    # IMPORTANTE 3: Persistencia de datos
    volumes:
      - agent_data:/sb-agent/data
      - /etc/localtime:/etc/localtime:ro

volumes:
  sb_postgres_data_new:
  rabbitmq_data:
  agent_data:
