spring:
  application:
    name: sb-api-gateway
  cloud:
    gateway:
      # =================================================================
      # DEFINICIÓN DE RUTAS DEL API GATEWAY
      # =================================================================
      routes:
        # 1. Ruta para el Servicio de Autenticación (Java)
        - id: sb-auth-service
          uri: http://localhost:8081 # Puerto estándar para el servicio de auth
          predicates:
            - Path=/auth/**
          filters:
            - name: CircuitBreaker
              args:
                name: authServiceCircuitBreaker
                fallbackUri: forward:/fallback/auth

        # 2. Ruta para el Servicio de Reportes (Java)
        - id: sb-reporting-service
          uri: http://localhost:8082 # Puerto estándar para el servicio de reportes
          predicates:
            - Path=/reports/**
          filters:
            - name: CircuitBreaker
              args:
                name: reportingServiceCircuitBreaker
                fallbackUri: forward:/fallback/reporting

        # 3. Ruta para el Orquestador Core (C#)
        - id: sb-core-orchestrator
          uri: http://localhost:5001 # Puerto estándar para el servicio core en C#
          predicates:
            - Path=/core/**
          filters:
            - name: CircuitBreaker
              args:
                name: coreServiceCircuitBreaker
                fallbackUri: forward:/fallback/core

        # 4. Ruta para el Monitor de Errores (C#)
        - id: sb-error-monitor
          uri: http://localhost:5002 # Puerto estándar para el servicio de errores en C#
          predicates:
            - Path=/errors/**
          filters:
            - name: CircuitBreaker
              args:
                name: errorMonitorCircuitBreaker
                fallbackUri: forward:/fallback/error

      # =================================================================
      # CONFIGURACIÓN GLOBAL DE FILTROS Y TIMEOUTS
      # =================================================================
      httpclient:
        connect-timeout: 5000 # 5 segundos
        response-timeout: 10s # 10 segundos

  # =====================================================================
  # CONFIGURACIÓN DE SEGURIDAD (VALIDACIÓN DE JWT)
  # =====================================================================
  security:
    oauth2:
      resourceserver:
        jwt:
          # El Gateway usará esta URI para obtener las claves públicas y validar la firma del token JWT
          jwk-set-uri: http://localhost:8081/oauth2/jwks

# =======================================================================
# CONFIGURACIÓN DE RESILIENCE4J (CIRCUIT BREAKER)
# =======================================================================
resilience4j:
  circuitbreaker:
    instances:
      authServiceCircuitBreaker:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
      reportingServiceCircuitBreaker:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
      coreServiceCircuitBreaker:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
      errorMonitorCircuitBreaker:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
  timelimiter:
    instances:
      default:
        timeout-duration: 5s

# =======================================================================
# CONFIGURACIÓN DE LOGGING
# =======================================================================
logging:
  level:
    root: INFO
    com.systembreak: DEBUG # Más detalle para nuestro código
    org.springframework.cloud.gateway: TRACE # Muy útil para depurar enrutamiento y filtros

# =======================================================================
# CONFIGURACIÓN DE DOCUMENTACIÓN (OPENAPI/SWAGGER)
# =======================================================================
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
  show-actuator: true
