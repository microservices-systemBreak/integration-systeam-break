spring.application.name=SBAuthService

server.port=8282

spring.datasource.url=jdbc:mysql://${AUTH_DB_HOST:localhost}:3306/sb_auth_db?createDatabaseIfNotExist=true
spring.datasource.username=${AUTH_DB_USER:user_dev}
spring.datasource.password=${AUTH_DB_PASSWORD:dev_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

jwt.secret=${JWT_SECRET_KEY:VERY_LONG_AND_SECURE_SECRET_KEY_123456789012}
jwt.expiration-ms=${JWT_EXPIRATION:3600000}
jwt.refresh-expiration-ms=604800000

logging.level.root=DEBUG