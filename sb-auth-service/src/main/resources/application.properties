spring.application.name=SBAuthService

server:
port: 8080 # Default port

spring:
application:
name: sb-auth-service
datasource:
url: jdbc:mysql://${AUTH_DB_HOST:localhost}:3306/sb_auth_db?createDatabaseIfNotExist=true
username: ${AUTH_DB_USER:user_dev}
password: ${AUTH_DB_PASSWORD:dev_password}
driver-class-name: com.mysql.cj.jdbc.Driver
jpa:
hibernate:
ddl-auto: none # Managed by Flyway
show-sql: true
flyway:
enabled: true
locations: classpath:db/migration

# Custom JWT configuration (Will be implemented in security package)
jwt:
secret: ${JWT_SECRET_KEY:VERY_LONG_AND_SECURE_SECRET_KEY}
[cite_start]expiration-ms: 3600000 # 1 hour for access token [cite: 68]
[cite_start]refresh-expiration-ms: 604800000 # 7 days for refresh token [cite: 69]