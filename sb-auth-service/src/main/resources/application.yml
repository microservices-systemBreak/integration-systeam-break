spring:
  application:
    name: sb-auth-service
  datasource:
    url: jdbc:postgresql://${AUTH_DB_HOST:localhost}:5432/sb_auth_db
    username: ${AUTH_DB_USER:postgres}
    password: ${AUTH_DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

# Custom JWT configuration
jwt:
  secret: ${JWT_SECRET_KEY:VERY_LONG_AND_SECURE_SECRET_KEY}
  expiration-ms: 86400000 # 1 day
  refresh-expiration-ms: 604800000 # 7 days
server:
  port: 8080
